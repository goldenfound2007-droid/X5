name: Build Inst100gramm 1.2 unsigned

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Apply version 1.1 source layer
        run: |
          cp patch_new/MainActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/MainActivity.kt
          cp patch_new/DownloadsActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/DownloadsActivity.kt
          cp patch_new/LoginActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/LoginActivity.kt
          cp patch_new/SplashActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/SplashActivity.kt
          cp patch_new/UiKit.kt app/src/main/java/com/cardinalich/kardinalgrab/UiKit.kt
          cp patch_new/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp patch_new/app-build.gradle.kts app/build.gradle.kts
          cp patch_new/launcher_foreground.xml app/src/main/res/drawable/launcher_foreground.xml
          cp patch_new/raven_icon.xml app/src/main/res/drawable/raven_icon.xml
          cp patch_new/launcher_logo.jpg app/src/main/res/drawable/launcher_logo.jpg
          cp patch_new/splash_logo.jpg app/src/main/res/drawable/splash_logo.jpg
          cp patch_new/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp patch_new/ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Apply version 1.2 source layer
        run: |
          base64 -d patch_v12.tar.gz.b64 > patch_v12.tar.gz
          tar -xzf patch_v12.tar.gz
          cp patch_v12/MainActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/MainActivity.kt
          cp patch_v12/DownloadsActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/DownloadsActivity.kt
          cp patch_v12/LoginActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/LoginActivity.kt
          cp patch_v12/SplashActivity.kt app/src/main/java/com/cardinalich/kardinalgrab/SplashActivity.kt
          cp patch_v12/app-build.gradle.kts app/build.gradle.kts
          cp patch_v12/README.md README.md
          cp patch_v12/CHANGELOG.md CHANGELOG.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Prepare signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
          cp app/build/outputs/apk/release/app-release-unsigned.apk Inst100gramm-v1.2-unsigned.apk

      - name: Upload unsigned APK and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: Inst100gramm-v1.2-unsigned
          path: |
            Inst100gramm-v1.2-unsigned.apk
            signing-tools/apksigner
            signing-tools/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 30
